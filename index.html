<!DOCTYPE html>
<html lang="ar" dir="rtl" data-ads="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مزاد · مزادات السيارات والمقتنيات في المملكة</title>
  <meta name="description" content="زايد على السيارات والساعات والجوالات والمجوهرات واللوحات المميزة في مزادات موثّقة داخل المملكة.">
  <meta name="theme-color" content="#062E22">
  <link rel="preload" href="public/fonts/readex-pro-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="dist/styles.css">
  <script type="module" src="src/js/main.js"></script>
</head>
<body>
  <a href="#main" class="sr-only z-50 rounded-full bg-white px-4 py-2 font-semibold focus:not-sr-only focus:fixed focus:start-4 focus:top-4">تخطَّ إلى المحتوى</a>

  <div class="flex min-h-screen flex-col">
    <div id="site-top" class="contents"></div>

    <div data-ad-slot class="container-page pt-4">
      <div id="ad-leaderboard" class="h-20 sm:h-[110px]"></div>
    </div>

    <main id="main" class="container-page flex flex-col gap-10 pb-16 pt-5 sm:gap-11">
      <section aria-label="مزادات مميزة" class="on-dark rounded-[22px] bg-forest p-3 sm:rounded-hero sm:p-4">
        <div id="featured" class="flex flex-col gap-3 sm:gap-4 md:flex-row"></div>
      </section>

      <section aria-labelledby="cats-title" class="flex flex-col gap-4">
        <div class="section-head">
          <h2 id="cats-title" class="section-title">تصفّح الفئات</h2>
          <a href="#" class="text-sm font-semibold">كل الفئات</a>
        </div>
        <div id="category-grid" class="grid grid-cols-4 gap-x-2.5 gap-y-4 sm:gap-3.5 xl:grid-cols-8"></div>
      </section>

      <section id="live" aria-labelledby="live-title" class="flex scroll-mt-40 flex-col gap-[18px]">
        <div class="flex flex-wrap items-center justify-between gap-3.5">
          <h2 class="section-title"><span id="live-title">مزادات مباشرة</span> <span id="live-count" class="text-[15px] font-normal text-ink-muted"></span></h2>
          <div id="sort-tabs" class="scroll-row -m-0.5 max-w-full gap-2 p-0.5" role="group" aria-label="ترتيب المزادات"></div>
        </div>
        <div id="lot-grid" class="grid grid-cols-1 gap-x-5 gap-y-6 sm:grid-cols-2 lg:grid-cols-3 lg:gap-y-7 xl:grid-cols-4" aria-live="polite"></div>
        <button id="show-more" type="button" class="btn-outline self-center px-7 py-3 text-sm">عرض المزيد</button>
      </section>

      <section data-ad-slot aria-label="إعلانات" id="ad-mid" class="grid grid-cols-1 gap-4 lg:grid-cols-2"></section>

      <section aria-labelledby="picks-title" class="flex flex-col gap-4">
        <div class="section-head">
          <h2 id="picks-title" class="section-title">اختيارات الأسبوع</h2>
          <span class="whitespace-nowrap text-[13px] text-ink-muted">منتقاة من فريق الخبراء</span>
        </div>
        <div id="picks" class="scroll-row -mx-4 snap-x snap-mandatory scroll-px-4 gap-4 px-4 pb-1.5 sm:mx-0 sm:px-0 sm:scroll-px-0"></div>
      </section>

      <section aria-label="لماذا مزاد" id="trust" class="grid grid-cols-1 gap-px overflow-hidden rounded-card border border-line bg-line-soft sm:grid-cols-2 lg:grid-cols-4"></section>

      <section id="sell" aria-labelledby="sell-title" class="on-dark grid scroll-mt-40 grid-cols-1 overflow-hidden rounded-[22px] bg-forest text-white lg:grid-cols-2">
        <div class="flex flex-col justify-center gap-4 p-6 sm:p-10">
          <h2 id="sell-title" class="m-0 text-2xl font-bold leading-[1.4] sm:text-[30px]">بيع سيارتك أو مقتنياتك لآلاف المزايدين في المملكة</h2>
          <p class="m-0 text-[15px] leading-[1.8] text-white/85">أضف منتجك، حدد سعر الافتتاح، وسنراجعه وننشره في المزاد خلال 48 ساعة.</p>
          <div class="flex flex-wrap gap-2.5">
            <a href="#" class="btn-lime px-6 py-[13px] text-[15px]">ابدأ البيع</a>
            <a href="#" class="btn-ghost-dark px-6 py-[13px] text-[15px]">كيف يعمل؟</a>
          </div>
        </div>
        <div id="sell-media" class="relative min-h-[220px] sm:min-h-[280px]"></div>
      </section>
    </main>

    <div id="site-footer" class="contents"></div>
  </div>
</body>
</html>
